{% extends "base.html" %}
{% load i18n %}
{% block content %}
<section class="form-page narrow">
  <h1>{% translate "Create your account" %}</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
        {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="button">{% translate "Sign up" %}</button>
  </form>
</section>
{% endblock %}
